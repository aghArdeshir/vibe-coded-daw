<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebDAW</title>
<style>
  :root {
    --bg: #121418; --panel: #1b1e24; --panel2: #22262e; --line: #2c313a;
    --text: #d9dde4; --dim: #8a93a2; --accent: #4cc2ff; --rec: #ff4d5e;
    --mute: #ffb347; --solo: #ffe14d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-rows: auto 1fr auto auto; overflow: hidden;
  }
  button, input, select { font: inherit; color: inherit; }
  button {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 10px; cursor: pointer;
  }
  button:hover { border-color: #46525f; }
  button:active { background: #2a2f38; }
  input[type=number], select {
    background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px;
  }
  input[type=range] { accent-color: var(--accent); margin: 0; }

  /* ---- transport ---- */
  #transport {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  #transport .group { display: flex; gap: 6px; }
  #transport .group button { width: 40px; font-size: 15px; padding: 5px 0; }
  #btn-play.active { background: var(--accent); color: #00222f; border-color: var(--accent); }
  #btn-rec { color: var(--rec); }
  #btn-rec.active { background: var(--rec); color: #fff; border-color: var(--rec); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .65; } }
  #clock { display: flex; flex-direction: column; min-width: 120px; }
  #time { font: 600 20px ui-monospace, SFMono-Regular, Menlo, monospace; }
  #bars { color: var(--dim); font-size: 11px; }
  #transport label { display: flex; align-items: center; gap: 6px; color: var(--dim); }
  #bpm, #latency { width: 64px; }
  #zoom, #master { width: 100px; }
  .spacer { flex: 1; }

  /* ---- timeline ---- */
  #timeline { position: relative; overflow: auto; min-height: 0; background: var(--bg); }
  .inner { position: relative; width: calc(var(--head-w) + var(--lane-w)); min-width: 100%; }
  .row { display: flex; height: var(--row-h); border-bottom: 1px solid var(--line); }
  .ruler-row { position: sticky; top: 0; z-index: 4; height: 28px; background: var(--panel); }
  .head {
    position: sticky; left: 0; z-index: 3; flex: none; width: var(--head-w);
    background: var(--panel); border-right: 1px solid var(--line);
    padding: 6px 8px; display: flex; flex-direction: column; gap: 5px; justify-content: center;
  }
  .corner { z-index: 5; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding-top: 0; padding-bottom: 0; }
  .lane { flex: none; width: var(--lane-w); position: relative; }
  .lane canvas { position: sticky; left: var(--head-w); display: block; cursor: text; }
  .ruler-row .lane canvas { cursor: pointer; }
  .row.quiet .lane canvas { opacity: .45; }
  .row.editing .head { box-shadow: inset 3px 0 0 var(--accent); }
  .playhead {
    position: absolute; top: 0; bottom: 0; left: var(--head-w); width: 1px; z-index: 6;
    background: #fff; box-shadow: 0 0 0 .5px rgba(255,255,255,.35); pointer-events: none;
  }
  .hint { position: sticky; left: 0; width: max-content; max-width: 100vw; padding: 40px; color: var(--dim); }
  .hint[hidden] { display: none; }

  .line1, .line2 { display: flex; gap: 5px; align-items: center; }
  .name {
    flex: 1; min-width: 0; background: transparent; border: 1px solid transparent;
    border-radius: 4px; padding: 2px 5px; font-weight: 600;
  }
  .name:hover, .name:focus { border-color: var(--line); background: var(--bg); outline: none; }
  .del { padding: 1px 7px; color: var(--dim); }
  .tbtn { min-width: 30px; padding: 3px 0; font-weight: 700; font-size: 12px; }
  .tbtn.edit { padding: 3px 9px; }
  .tbtn.mute.on { background: var(--mute); border-color: var(--mute); color: #000; }
  .tbtn.solo.on { background: var(--solo); border-color: var(--solo); color: #000; }
  .tbtn.arm { color: var(--rec); }
  .tbtn.arm.on { background: var(--rec); border-color: var(--rec); color: #fff; }
  .meter {
    flex: 1; height: 8px; margin-left: 4px; border-radius: 4px; overflow: hidden;
    display: flex; justify-content: flex-end;
    background: linear-gradient(90deg, #3ddc84, #e6e34a 75%, #ff4d5e);
  }
  .meter i { display: block; height: 100%; width: 100%; background: #0e1013; }
  .slider { display: grid; grid-template-columns: 26px 1fr 52px; align-items: center; gap: 6px; color: var(--dim); font-size: 11px; }
  .slider input { width: 100%; }
  .slider output { text-align: right; font-variant-numeric: tabular-nums; }

  /* ---- piano roll ---- */
  #editor { height: 300px; display: flex; flex-direction: column; border-top: 1px solid var(--line); background: var(--panel); }
  #editor[hidden] { display: none; }
  .roll-bar { display: flex; align-items: center; gap: 14px; padding: 6px 12px; border-bottom: 1px solid var(--line); }
  .roll-bar label { color: var(--dim); display: flex; gap: 6px; align-items: center; }
  .hint-text { color: var(--dim); font-size: 11px; }
  .roll-scroll { flex: 1; min-height: 0; overflow: auto; background: #181b20; }
  .roll-wrap { display: flex; width: max-content; }
  .roll-wrap canvas { display: block; }
  .roll-wrap canvas:first-child { position: sticky; left: 0; z-index: 2; }

  /* ---- misc ---- */
  #status { padding: 5px 12px; color: var(--dim); border-top: 1px solid var(--line); min-height: 26px; background: var(--panel); }
  #status.err { color: var(--rec); }
  #dropzone {
    position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center;
    background: rgba(18,20,24,.88); border: 3px dashed var(--accent); font-size: 22px; pointer-events: none;
  }
  #dropzone.show { display: flex; }
</style>
</head>
<body>

<header id="transport">
  <div class="group">
    <button id="btn-play" title="Play / Pause (Space)">▶</button>
    <button id="btn-stop" title="Stop and return to start">■</button>
    <button id="btn-rec" title="Record into the armed track (creates one if none is armed)">●</button>
  </div>
  <div id="clock"><span id="time">00:00.000</span><span id="bars">Bar 1 · Beat 1</span></div>
  <label>BPM <input id="bpm" type="number" min="30" max="300" step="1" value="120"></label>
  <label title="Shifts recordings earlier to compensate for audio round-trip latency. Leave empty for automatic.">
    Rec latency <input id="latency" type="number" step="1" placeholder="auto"> ms
  </label>
  <label>Zoom <input id="zoom" type="range" min="0" max="100" value="50"></label>
  <label>Master <input id="master" type="range" min="-60" max="6" step="0.1" value="0"></label>
  <span class="spacer"></span>
  <button id="add-audio">+ Audio</button>
  <button id="add-midi">+ MIDI</button>
  <button id="import">Import…</button>
  <input id="file" type="file" multiple accept=".wav,.mp3,audio/wav,audio/mpeg" hidden>
</header>

<main id="timeline"></main>

<section id="editor" hidden>
  <div class="roll-bar">
    <strong class="roll-title">Piano roll</strong>
    <label>Snap
      <select class="roll-snap">
        <option value="1">1/4</option>
        <option value="0.5">1/8</option>
        <option value="0.25" selected>1/16</option>
        <option value="0.125">1/32</option>
      </select>
    </label>
    <span class="hint-text">Click: add note · Drag: move · Drag right edge: resize · Right-click / Delete: remove</span>
    <span class="spacer"></span>
    <button class="roll-close">Close ✕</button>
  </div>
  <div class="roll-scroll"></div>
</section>

<footer id="status"></footer>
<div id="dropzone">Drop WAV / MP3 files to add them as tracks</div>

<script type="module" src="./main.js"></script>
</body>
</html>
